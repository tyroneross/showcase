name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # 11.5.1 is the documented floor for trusted publishing, and Node 22
      # ships npm 10.x — below it. https://docs.npmjs.com/trusted-publishers/
      - name: Use npm >= 11.5.1 (trusted-publishing floor)
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
